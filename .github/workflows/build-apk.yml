name: Build 30m Alerter APK (debug)

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build-apk:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Accept Android SDK licenses
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - name: Install Capacitor
        run: |
          npm init -y
          npm i @capacitor/core @capacitor/cli @capacitor/android
      - name: Sync www
        run: |
          mkdir -p www
          for f in index.html app.js datafeed.js indicators.js alerter.js styles.css manifest.webmanifest; do
            [ -f "$f" ] && cp "$f" www/ || echo "skip: $f"
          done
          for f in 관심종목.txt 종목예시30m.txt alert.wav icon-192.png icon-512.png; do
            [ -f "$f" ] && cp "$f" www/ || true
          done
          ls www
      - name: Init + Add Android
        run: |
          npx cap init "30m알리미" com.alerter.tf30m --web-dir=www || true
          npx cap add android || true
          npx cap sync android
      - name: Allow cleartext traffic
        run: |
          MANIFEST=android/app/src/main/AndroidManifest.xml
          grep -q 'usesCleartextTraffic' $MANIFEST || sed -i 's/<application/<application android:usesCleartextTraffic="true"/' $MANIFEST
      - name: Build debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-30m
          path: android/app/build/outputs/apk/debug/app-debug.apk
